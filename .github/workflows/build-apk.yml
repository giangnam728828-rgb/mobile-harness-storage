name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r28

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Online Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleOnlineDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mobile-harness-storage-debug
        path: app/build/outputs/apk/online/debug/*.apk
        retention-days: 30
